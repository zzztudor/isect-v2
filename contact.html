 <section id="contact" class="section contact">
  <div class="container">
    <h2 class="sec-title">Contact</h2>
    <p class="subtitle">Scrie-ne câteva detalii și revenim rapid cu răspunsul sau oferta potrivită.</p>

    <div class="contact-grid">
      <!-- aici vin formularul și harta -->
    </div>
  </div>
</section>
 <section class="section container" data-aos="fade-up">
  
  <div class="grid contact-grid">
    <!-- Stânga: formular -->
    <div class="card contact-card">
      <form id="contactForm" novalidate>
        <label> Nume
          <input name="name" type="text" required autocomplete="name" placeholder="Numele tău">
        </label>

        <label> Email
          <input name="email" type="email" required autocomplete="email" placeholder="email@exemplu.ro">
        </label>

        <label> Mesaj
          <textarea name="message" rows="5" required placeholder="Scrie-ne câteva detalii…"></textarea>
        </label>

        <!-- honeypot anti-bot (ascuns) -->
        <input type="text" name="company" class="hp">

        <button class="btn btn-primary" type="submit">Trimite</button>

        <!-- mesaj UX -->
        <p id="formNote" class="form-note" aria-live="polite"></p>
      </form>
    </div>

    <!-- Dreapta: hartă + info -->
    <div class="card contact-card">
      <h3>Ne găsești aici</h3>
      <div class="map-wrap">
        <iframe style="border: 0;" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2713.251011834957!2d27.592501789433747!3d47.152938093319186!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40cafb99b7149e6d%3A0x6697aed06a12ed81!2sFacultatea+de+Inginerie+Electric%C4%83%2C+Energetic%C4%83+%C8%99i+Informatic%C4%83+aplicat%C4%83!5e0!3m2!1sen!2sro!4v1478706427624" width="100%" height="240" frameborder="0" allowfullscreen="allowfullscreen"></iframe>

      </div>

      <div class="contact-info">
        <a href="tel:+40232278683">📞 +40-232-278683</a>
        <a href="mailto:electroconsultgroup@gmail.com">✉️ electroconsultgroup@gmail.com/a>
        <a href="https://wa.me/40232278683" target="_blank" rel="noopener">💬 WhatsApp</a>
        <p>📍 Bulevardul Profesor Dimitrie Mangeron 21-23, Iași, RO</p>
        <p>🕑 L–V: 09:00–17:00</p>
      </div>

      <div class="contact-cta">
        <a class="btn btn-ghost" href="servicii.html">Vezi servicii</a>
        <a class="btn btn-primary" href="contact.html#contactForm">Cere ofertă</a>
      </div>
    </div>
  </div>
</section>
